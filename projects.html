<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects — Prathosh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        /* Specific override for vertical grid on this page */
        #projects-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)) !important;
            gap: 4rem !important;
            width: 100% !important;
            padding: 0 !important;
        }

        .project-card {
            width: 100% !important;
        }
    </style>
</head>

<body>
    <div class="custom-cursor" id="custom-cursor">
        <span class="cursor-text">View Project</span>
    </div>

    <!-- Background -->
    <div class="glow-bg"></div>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Prathosh</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">← Back to Home</a></li>
            </ul>
        </div>
    </nav>

    <!-- All Projects Section -->
    <section class="section" id="projects" style="padding-top: 180px; min-height: 100vh;">
        <div class="container">
            <h1 class="section-title reveal">All Projects</h1>
            <div id="projects-grid">
                <!-- Injected by main.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container" id="footer-container">
            <p id="footer-text">&copy; 2026 Prathosh. All rights reserved.</p>
        </div>
    </footer>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
